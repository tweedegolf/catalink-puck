[package]
name = "puckfs"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
aead = "0.6.1"
arrayvec = { version = "0.7.8", default-features = false, features = ["std", "zeroize"] }
base64ct = { version = "1.8.3", default-features = false }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["arrayvec", "rand_core", "zeroize"] }
thiserror = { version = "2.0.20", default-features = false, features = ["std"] }
rand_core = { version = "0.6.4" }
