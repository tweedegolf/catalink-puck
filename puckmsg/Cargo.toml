[package]
name = "puckmsg"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
arrayvec = "0.7.8"
base64ct = { version = "1.8.3", features = ["alloc", "std"] }
puckfs = { path = "../puckfs" }
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }
aead = "0.6.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
thiserror = "2.0.20"
rand_core = { version = "0.6.4" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
